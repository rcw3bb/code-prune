[project]
name = "code-prune"
version = "1.0.0"
description = "Find unreachable, unused, and obsolete code before it becomes technical debt."
authors = [
    {name = "Ron Webb"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
keywords = ["cli", "static-analysis", "dead-code", "unused-code", "tree-sitter", "code-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "logenrich (>=1.0.1,<2.0.0)",
    "env-dir-bootstrap (>=1.0.0,<2.0.0)",
    "click (>=8.0.0,<9.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "braincraft (>=1.3.1,<2.0.0)",
    "tree-sitter (>=0.26.0,<0.27.0)",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
    "tree-sitter-javascript (>=0.25.0,<0.26.0)",
    "tree-sitter-typescript (>=0.23.2,<0.24.0)",
    "tree-sitter-java (>=0.23.5,<0.24.0)",
    "tree-sitter-gosu (>=0.3.0,<0.4.0)"
]

[project.scripts]
code-prune = "code_prune.cli:main"

[project.urls]
Homepage = "https://github.com/rcw3bb/code-prune"
Repository = "https://github.com/rcw3bb/code-prune"
Changelog = "https://github.com/rcw3bb/code-prune/blob/main/CHANGELOG.md"
Issues = "https://github.com/rcw3bb/code-prune/issues"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.poetry]
packages = [{include = "code_prune"}]
include = [
    "code_prune/logging.ini",
    "code_prune/config.ini",
    "code_prune/.codepruneignore",
    "code_prune/symbol_ignore",
    "CHANGELOG.md"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
